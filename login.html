<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="style2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="login-body">
        <div class="body-form">
            <div class="container">
                <div class="login-box">
                    <div class="login-header">
                        <h2>Bem-vindo de volta!</h2>
                    </div>
                    <form id="login-form" onsubmit="event.preventDefault(); window.location.replace('index.html');">
                        <div class="input-container">
                            <label for="username">Email</label>
                            <input type="email" id="username" placeholder="Digite seu email" required onkeyup="cracteres()"> 
                        </div>
                        <p class="aviso"></p>
                        <div class="input-container">
                            <label for="password">Senha</label>
                            <input type="password" id="password" placeholder="Digite sua senha" required onkeyup="cracteres()">
                        </div>
                        <p class="aviso"></p>
                        <button type="entrar">Entrar</button>
                    <div class="login-footer">
                        <p>Não tem uma conta?<a href="signup.html"> Cadastre-se</a></p>
                        <p>Login - <a href="loginadm.html">Administrador</a></p>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="database.js"></script>
    <script src="script.js"></script>
</body>

</html>
