<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <div class="signup-body">
        <div class="body-form">
            <div class="container">
                <div class="login-box">
                    <div class="login-header">
                        <h2>Cadastro Administrador</h2>
                    </div>
                    <form id="signup-form">
                        <div class="div-form">
                            <div class="div1">

                                <div class="input-container">
                                    <label for="cpf">CPF</label>
                                    <input type="text" id="cpf" placeholder="Digite seu CPF" required>
                                </div>
                                <!-- endereco -->

                                <div class="div-form" id="cep-numero">
                                    <div class="input-container" id="cep-input">
                                        <label for="cep">CEP</label>
                                        <input type="text" id="cep" placeholder="seu CEP" required>
                                    </div>
                                    <div class="input-container">
                                        <label for="numero">Numero</label>
                                        <input type="text" id="numero" placeholder="numero da Casa" required>
                                    </div>
                                </div>
                                <div class="input-container">
                                    <label for="estado">Estado</label>
                                    <input type="text" id="estado" placeholder="seu Estado" required>
                                </div>
                                <div class="input-container">
                                    <label for="cidade">Cidade</label>
                                    <input type="text" id="cidade" placeholder="sua Cidade" required>
                                </div>
                                <div class="input-container">
                                    <label for="bairro">Bairro</label>
                                    <input type="text" id="bairro" placeholder="seu Bairro" required>
                                </div>
                                <div class="input-container">
                                    <label for="rua">Rua</label>
                                    <input type="text" id="rua" placeholder="sua Rua" required>
                                </div>

                                <!-- -- -->
                            </div>
                            <div class="div2">
                                <div class="input-container">
                                    <label for="nome">Nome</label>
                                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                                </div>
                                <div class="input-container">
                                    <label for="sobrenome">Sobrenome</label>
                                    <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" required>
                                </div>
                                <label id="sexolabel">Sexo: </label>
                                <div class="sexo">
                                    <label class="opcao-sexo">
                                        <input type="radio" nome="sexo" value="Feminino">
                                        Feminino
                                    </label>
                                    <label class="opcao-sexo">
                                        <input type="radio" nome="sexo" value="Masculino">
                                        Masculino
                                    </label>
                                </div>

                                <div class="input-container">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" placeholder="Digite seu email" required>
                                </div>
                                <div class="input-container">
                                    <label for="password">Senha</label>
                                    <input type="password" id="password" placeholder="Digite sua senha" required>
                                </div>
                                <button type="submit">Próximo</button>
                            </div>
                        </div>
                    </form>
                    <div class="login-footer">
                        <p>Cadastro - <a href="signup.html">Usuário</a></p>
                        <p>Base - <a href="usuarios.html">Usuários</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="database.js"></script>
    <script src="script.js"></script>
    <script src="accessibility.js"></script>
</body>

</html>
